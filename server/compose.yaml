services:
  flixdesk:
    image: "${CROSSDESK_IMAGE:-huanhq99/flixdesk-server:latest}"
    container_name: flixdesk_server
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 20s
    ulimits:
      nofile:
        soft: ${CROSSDESK_NOFILE:-65536}
        hard: ${CROSSDESK_NOFILE:-65536}
    environment:
      # 全部为可选参数；留空直接启动后，打开 http://<服务器IP>:9098 在 Web 面板中可视化配置
      PANEL_PORT: "${PANEL_PORT:-9098}"
      PANEL_PASSWORD: "${PANEL_PASSWORD:-}"
      EXTERNAL_IP: "${EXTERNAL_IP:-}"
      INTERNAL_IP: "${INTERNAL_IP:-}"
      CROSSDESK_SERVER_PORT: "${CROSSDESK_SERVER_PORT:-9099}"
      COTURN_PUBLIC_HOST: "${COTURN_PUBLIC_HOST:-}"
      COTURN_PORT: "${COTURN_PORT:-3478}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - "${CROSSDESK_DATA_DIR:-./data}:/var/lib/crossdesk"
      - "${CROSSDESK_LOG_DIR:-./logs}:/var/log/crossdesk"
