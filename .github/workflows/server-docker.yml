name: Build and Push Flixdesk Server Docker Image

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - ".github/workflows/server-docker.yml"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: write

jobs:
  validate-deployment:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell scripts and Compose configuration
        shell: bash
        env:
          COTURN_AUTH_SECRET: ci-validation-only-not-for-production
          COTURN_STATELESS_NONCE_SECRET: ci-validation-only-not-for-production
        run: |
          bash -n docker/start.sh docker/generate_certs.sh
          docker compose --env-file .env.example config --quiet

  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            artifact_name: crossdesk_server-linux-amd64
          - arch: arm64
            runner: ubuntu-22.04-arm
            artifact_name: crossdesk_server-linux-arm64

    container:
      image: ubuntu:22.04
      options: --user root

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            gnupg \
            software-properties-common \
            git \
            curl \
            unzip \
            build-essential

      - name: Install xmake
        shell: bash
        run: |
          add-apt-repository -y ppa:xmake-io/xmake
          apt-get update
          apt-get install -y --no-install-recommends xmake

      - name: Build ${{ matrix.arch }} binary
        env:
          XMAKE_GLOBALDIR: /data
          XMAKE_ROOT: y
        shell: bash
        run: |
          xmake f -m release --root -y
          xmake b --root -vy crossdesk_server
          BINARY_PATH="$(find build -type f -path '*/release/crossdesk_server' | head -n 1)"
          test -n "${BINARY_PATH}"
          mkdir -p dist
          cp "${BINARY_PATH}" "./dist/${{ matrix.artifact_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: server/dist/${{ matrix.artifact_name }}
          compression-level: 0

  docker-push:
    needs: [validate-deployment, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-22.04
            artifact_name: crossdesk_server-linux-amd64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-22.04-arm
            artifact_name: crossdesk_server-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ${{ matrix.arch }} binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: server/dist

      - name: Prepare runtime binary path
        shell: bash
        working-directory: server
        run: |
          mv "./dist/${{ matrix.artifact_name }}" ./dist/crossdesk_server
          chmod +x ./dist/crossdesk_server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/flixdesk-server"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            echo "tags=${IMAGE}:${TAG}-${{ matrix.arch }},${IMAGE}:latest-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:latest-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/docker/dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=flixdesk-server-${{ matrix.arch }}
          cache-to: type=gha,scope=flixdesk-server-${{ matrix.arch }},mode=max

  docker-manifest:
    needs: docker-push
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifest
        shell: bash
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/flixdesk-server"

          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            "${IMAGE}:latest-amd64" \
            "${IMAGE}:latest-arm64"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            docker buildx imagetools create \
              -t "${IMAGE}:${GITHUB_REF_NAME}" \
              "${IMAGE}:${GITHUB_REF_NAME}-amd64" \
              "${IMAGE}:${GITHUB_REF_NAME}-arm64"
          fi
