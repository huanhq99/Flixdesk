name: Build & Release Flixdesk Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      desktop_version:
        description: "Desktop version (e.g. 1.7.8). Leave blank to use client/VERSION."
        required: false
        type: string
      release_notes:
        description: "Optional release notes shown in GitHub Release and in-app update dialog."
        required: false
        type: string
      default_server_host:
        description: "Optional default self-hosted server IP/domain to bake into the build. Leave blank for generic build."
        required: false
        type: string
      publish_release:
        description: "Publish GitHub Release and update version.json for in-app update notifications"
        required: false
        default: true
        type: boolean
      build_macos:
        description: "Build macOS Apple Silicon (arm64) installer (.pkg)"
        required: false
        default: true
        type: boolean
      build_windows:
        description: "Build Windows x64 installer (.exe)"
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: write

env:
  XMAKE_MIN_VERSION: "3.1.1"

jobs:
  prepare-version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      clean_version: ${{ steps.version.outputs.clean_version }}
      release_date: ${{ steps.version.outputs.release_date }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: version
        shell: bash
        run: |
          TODAY="$(TZ=Asia/Shanghai date +%Y%m%d)"
          ISO_DATE="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            if [[ "${RAW_TAG}" =~ ^v[0-9]+(\.[0-9]+){1,3}-[0-9]{8}$ ]]; then
              VERSION_NUM="${RAW_TAG}"
            else
              VERSION_NUM="${RAW_TAG}-${TODAY}"
            fi
          else
            if [[ -n "${{ inputs.desktop_version }}" ]]; then
              BASE_VER="${{ inputs.desktop_version }}"
            elif [[ -f client/VERSION ]]; then
              BASE_VER="$(tr -d '[:space:]' < client/VERSION)"
            else
              BASE_VER="1.7.8"
            fi
            BASE_VER="${BASE_VER#v}"
            VERSION_NUM="v${BASE_VER}-${TODAY}"
          fi
          CLEAN_VER="${VERSION_NUM#v}"
          echo "version=${VERSION_NUM}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "release_date=${ISO_DATE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION_NUM} (${ISO_DATE})"

  build-macos-arm64:
    name: Build macOS (Apple Silicon)
    needs: prepare-version
    if: ${{ github.event_name == 'push' || inputs.build_macos != false }}
    runs-on: macos-26
    env:
      VERSION_NUM: ${{ needs.prepare-version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Select Xcode 26.6
        shell: bash
        run: |
          if [[ -d /Applications/Xcode_26.6.app/Contents/Developer ]]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Cache xmake dependencies
        uses: actions/cache@v5
        with:
          path: ~/.xmake/packages
          key: "${{ runner.os }}-xmake-deps-arm-macos26-${{ github.run_id }}"
          restore-keys: |
            ${{ runner.os }}-xmake-deps-arm-macos26-

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Optional bake default server host
        if: ${{ inputs.default_server_host != '' }}
        shell: bash
        run: |
          chmod +x scripts/set-default-server.sh
          ./scripts/set-default-server.sh --host "${{ inputs.default_server_host }}"

      - name: Ensure minimum Xmake version
        uses: ./client/.github/actions/ensure-xmake
        with:
          minimum-version: ${{ env.XMAKE_MIN_VERSION }}

      - name: Update xmake repositories
        working-directory: client
        run: xmake repo -u

      - name: Build Flixdesk Desktop
        working-directory: client
        run: |
          xmake f --target_minver=${MACOSX_DEPLOYMENT_TARGET} --CROSSDESK_VERSION=${VERSION_NUM} --USE_CUDA=false -vyD
          xmake b -vy crossdesk

      - name: Package macOS installer (.pkg)
        working-directory: client
        run: |
          chmod +x ./apps/desktop/scripts/macos/pkg_arm64.sh
          ./apps/desktop/scripts/macos/pkg_arm64.sh "${VERSION_NUM}"
          cp "crossdesk-macos-arm64-${VERSION_NUM}.pkg" "flixdesk-macos-arm64-${VERSION_NUM}.pkg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: flixdesk-macos-arm64-${{ env.VERSION_NUM }}
          path: client/flixdesk-macos-arm64-${{ env.VERSION_NUM }}.pkg
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows (x64)
    needs: prepare-version
    if: ${{ github.event_name == 'push' || inputs.build_windows != false }}
    runs-on: windows-2022
    env:
      VERSION_NUM: ${{ needs.prepare-version.outputs.version }}
      XMAKE_GLOBALDIR: D:\xmake_global
    steps:
      - name: Cache xmake dependencies
        uses: actions/cache@v5
        with:
          path: D:\xmake_global\.xmake\packages
          key: "${{ runner.os }}-xmake-deps-x64-${{ github.run_id }}"
          restore-keys: |
            ${{ runner.os }}-xmake-deps-x64-

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Optional bake default server host
        if: ${{ inputs.default_server_host != '' }}
        shell: bash
        run: |
          chmod +x scripts/set-default-server.sh
          ./scripts/set-default-server.sh --host "${{ inputs.default_server_host }}"

      - name: Ensure minimum Xmake version
        uses: ./client/.github/actions/ensure-xmake
        with:
          minimum-version: ${{ env.XMAKE_MIN_VERSION }}

      - name: Update xmake repositories
        working-directory: client
        run: xmake repo -u

      - name: Download INetC plugin
        shell: powershell
        run: |
          $url = "https://github.com/DigitalMediaServer/NSIS-INetC-plugin/releases/download/v1.0.5.7/InetC.zip"
          $out = "$env:RUNNER_TEMP\InetC.zip"
          Invoke-WebRequest -Uri $url -OutFile $out
          Expand-Archive $out -DestinationPath "$env:RUNNER_TEMP\InetC" -Force
          $source = "$env:RUNNER_TEMP\InetC\x86-unicode\INetC.dll"
          $target = "C:\Program Files (x86)\NSIS\Plugins\x86-unicode\INetC.dll"
          Copy-Item $source $target -Force

      - name: Copy nsProcess plugin to NSIS folder
        shell: powershell
        run: |
          $nsisPluginDir = "C:\Program Files (x86)\NSIS\Plugins\x86-unicode"
          Copy-Item "${{ github.workspace }}\client\apps\desktop\scripts\windows\nsProcess.dll" $nsisPluginDir -Force

      - name: Build Flixdesk Desktop
        working-directory: client
        run: |
          xmake f --CROSSDESK_VERSION=${{ env.VERSION_NUM }} --USE_CUDA=false -y
          xmake b -vy crossdesk

      - name: Package Windows installer (.exe)
        working-directory: client
        shell: pwsh
        run: |
          & "${{ github.workspace }}\client\apps\desktop\scripts\windows\pkg_x64.ps1" $env:VERSION_NUM
          $src = "${{ github.workspace }}\client\apps\desktop\scripts\windows\crossdesk-win-x64-$env:VERSION_NUM.exe"
          $dst = "${{ github.workspace }}\client\apps\desktop\scripts\windows\flixdesk-win-x64-$env:VERSION_NUM.exe"
          Copy-Item $src $dst -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: flixdesk-win-x64-${{ env.VERSION_NUM }}
          path: client/apps/desktop/scripts/windows/flixdesk-win-x64-${{ env.VERSION_NUM }}.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release & Update version.json
    needs: [prepare-version, build-macos-arm64, build-windows-x64]
    if: ${{ always() && (needs.build-macos-arm64.result == 'success' || needs.build-windows-x64.result == 'success') && (github.event_name == 'push' || inputs.publish_release != false) }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION_NUM: ${{ needs.prepare-version.outputs.version }}
      CLEAN_VER: ${{ needs.prepare-version.outputs.clean_version }}
      RELEASE_DATE: ${{ needs.prepare-version.outputs.release_date }}
      RELEASE_NOTES: ${{ inputs.release_notes || 'Flixdesk desktop release (macOS Apple Silicon + Windows x64).' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate updated version.json
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["VERSION_NUM"]
          clean_ver = os.environ["CLEAN_VER"]
          release_date = os.environ["RELEASE_DATE"]
          release_notes = os.environ["RELEASE_NOTES"]

          current_path = Path("version.json")
          data = json.loads(current_path.read_text(encoding="utf-8")) if current_path.exists() else {}
          downloads = dict(data.get("downloads") or {})

          artifact_dir = Path("release-artifacts")
          mapping = {
              f"flixdesk-macos-arm64-{tag}.pkg": "macos-arm64",
              f"flixdesk-win-x64-{tag}.exe": "windows-x64",
          }

          for filename, platform in mapping.items():
              p = artifact_dir / filename
              if not p.is_file():
                  continue
              h = hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      h.update(chunk)
              downloads[platform] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{filename}",
                  "filename": filename,
                  "version": clean_ver,
                  "releaseDate": release_date,
                  "size": p.stat().st_size,
                  "sha256": h.hexdigest(),
              }

          updated = {
              "latest_version": clean_ver,
              "version": clean_ver,
              "releaseDate": release_date,
              "patch": 0,
              "tagName": tag,
              "releaseName": f"Flixdesk {tag}",
              "releaseNotes": release_notes,
              "downloads": downloads,
          }
          current_path.write_text(json.dumps(updated, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(current_path.read_text(encoding="utf-8"))
          PY

      - name: Create or update GitHub Release
        shell: bash
        run: |
          if gh release view "${VERSION_NUM}" >/dev/null 2>&1; then
            gh release upload "${VERSION_NUM}" release-artifacts/* version.json --clobber
          else
            gh release create "${VERSION_NUM}" release-artifacts/* version.json \
              --title "Flixdesk ${VERSION_NUM}" \
              --notes "${RELEASE_NOTES}" \
              --latest
          fi

      - name: Commit updated version.json to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update version.json for ${VERSION_NUM} [skip ci]"
            git push origin main
          fi
