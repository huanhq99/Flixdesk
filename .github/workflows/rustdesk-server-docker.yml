name: Build and Push Flixdesk RustDesk All-in-One Server

on:
  push:
    branches: ["main"]
    paths:
      - "rustdesk-server/**"
      - ".github/workflows/rustdesk-server-docker.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python & Compose
        shell: bash
        run: |
          python3 -m py_compile rustdesk-server/panel/panel.py
          docker compose -f rustdesk-server/compose.yaml config --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'huanhq99' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: rustdesk-server
          file: rustdesk-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            huanhq99/flixdesk-rustdesk:latest
            ghcr.io/huanhq99/flixdesk-rustdesk:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=flixdesk-rustdesk
          cache-to: type=gha,scope=flixdesk-rustdesk,mode=max
